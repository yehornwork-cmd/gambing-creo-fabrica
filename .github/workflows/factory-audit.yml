name: Factory audit

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install certifi
      - run: bash bin/factory-audit
      - run: python3 library/_pipeline/orchestrator/preset_factory.py validate
