<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a1a;
        font-family: "Inter", "Segoe UI", sans-serif;
      }

      /* Slot machine frame */
      #slot-frame {
        position: absolute;
        top: 280px;
        left: 60px;
        width: 960px;
        height: 720px;
        background: linear-gradient(135deg, #1a1040 0%, #2d1b69 50%, #1a1040 100%);
        border-radius: 24px;
        border: 4px solid #4a3a8a;
        box-shadow: 0 0 60px rgba(138, 43, 226, 0.4), inset 0 0 40px rgba(0,0,0,0.5);
        overflow: hidden;
      }

      /* Slot header */
      #slot-header {
        height: 70px;
        background: linear-gradient(90deg, #1a1040, #3d2b8a, #1a1040);
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 2px solid #4a3a8a;
      }
      #slot-title {
        font-size: 32px;
        font-weight: 900;
        color: #ffd700;
        text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        letter-spacing: 2px;
      }

      /* Reels container */
      #reels {
        display: flex;
        height: 580px;
        padding: 20px;
        gap: 8px;
      }
      .reel {
        flex: 1;
        background: #0d0820;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        border: 1px solid #3a2a6a;
      }
      .symbol {
        height: 193px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 80px;
      }

      /* Balance bar */
      #balance-bar {
        position: absolute;
        top: 120px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .balance-item {
        background: rgba(20, 10, 50, 0.8);
        border: 1px solid #4a3a8a;
        border-radius: 8px;
        padding: 10px 20px;
      }
      .balance-label {
        font-size: 14px;
        color: #8888cc;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .balance-value {
        font-size: 28px;
        font-weight: 800;
        color: #ffd700;
      }

      /* Win popup */
      #win-popup {
        position: absolute;
        top: 580px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        background: linear-gradient(135deg, #ff6b00, #ffd700);
        padding: 20px 60px;
        border-radius: 16px;
        border: 3px solid #fff;
        box-shadow: 0 0 80px rgba(255, 215, 0, 0.8);
        z-index: 100;
      }
      #win-text {
        font-size: 48px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      }
      #win-amount {
        font-size: 64px;
        font-weight: 900;
        color: #fff;
        text-align: center;
      }

      /* CTA */
      #cta {
        position: absolute;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #8a2be2, #ff1493);
        padding: 24px 80px;
        border-radius: 16px;
        border: 2px solid #fff;
        box-shadow: 0 0 40px rgba(138, 43, 226, 0.6);
        opacity: 0;
      }
      #cta-text {
        font-size: 42px;
        font-weight: 900;
        color: #fff;
        text-align: center;
        text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      }
      #cta-sub {
        font-size: 20px;
        color: #ffd700;
        text-align: center;
        margin-top: 4px;
      }

      /* Coins */
      .coin {
        position: absolute;
        font-size: 48px;
        opacity: 0;
      }

      /* Multiplier badge */
      #multiplier {
        position: absolute;
        top: 480px;
        right: 80px;
        background: #ff0000;
        color: #fff;
        font-size: 36px;
        font-weight: 900;
        padding: 8px 20px;
        border-radius: 8px;
        border: 2px solid #fff;
        transform: scale(0);
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <!-- Balance bar -->
      <div id="balance-bar">
        <div class="balance-item">
          <div class="balance-label">Balance</div>
          <div class="balance-value" id="balance">A$ 500.00</div>
        </div>
        <div class="balance-item">
          <div class="balance-label">Bet</div>
          <div class="balance-value">A$ 2.00</div>
        </div>
      </div>

      <!-- Slot machine -->
      <div id="slot-frame">
        <div id="slot-header">
          <div id="slot-title">SWEET BONANZA</div>
        </div>
        <div id="reels">
          <div class="reel" id="reel1">
            <div class="symbol" style="color:#ff4488">🍇</div>
            <div class="symbol" style="color:#ffaa00">🍌</div>
            <div class="symbol" style="color:#ff44ff">🍬</div>
          </div>
          <div class="reel" id="reel2">
            <div class="symbol" style="color:#44ff88">🍉</div>
            <div class="symbol" style="color:#ffaa00">🍎</div>
            <div class="symbol" style="color:#ff44ff">🍭</div>
          </div>
          <div class="reel" id="reel3">
            <div class="symbol" style="color:#ff4488">🍇</div>
            <div class="symbol" style="color:#44ffff"> Plum</div>
            <div class="symbol" style="color:#ff44ff">🍬</div>
          </div>
        </div>
      </div>

      <!-- Multiplier badge -->
      <div id="multiplier" class="clip" data-start="5" data-duration="4" data-track-index="2">
        x5
      </div>

      <!-- Win popup -->
      <div id="win-popup" class="clip" data-start="6" data-duration="6" data-track-index="3">
        <div id="win-text">BIG WIN!</div>
        <div id="win-amount">A$ 4,250.00</div>
      </div>

      <!-- Coins -->
      <div class="coin clip" data-start="6" data-duration="6" data-track-index="4" id="coin1" style="top:600px;left:100px">🪙</div>
      <div class="coin clip" data-start="6.3" data-duration="5.7" data-track-index="4" id="coin2" style="top:700px;right:120px">🪙</div>
      <div class="coin clip" data-start="6.6" data-duration="5.4" data-track-index="4" id="coin3" style="top:900px;left:200px">🪙</div>

      <!-- CTA -->
      <div id="cta" class="clip" data-start="11" data-duration="4" data-track-index="5">
        <div id="cta-text">PLAY NOW</div>
        <div id="cta-sub">Get 50 Free Spins on Sign Up</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 0-3s: Spin reels
      tl.to("#reel1 .symbol", { y: -193, duration: 0.3, repeat: 4, ease: "power1.inOut", yoyo: true }, 0);
      tl.to("#reel2 .symbol", { y: -193, duration: 0.3, repeat: 5, ease: "power1.inOut", yoyo: true }, 0.1);
      tl.to("#reel3 .symbol", { y: -193, duration: 0.3, repeat: 6, ease: "power1.inOut", yoyo: true }, 0.2);

      // 3-5s: Reels settle, show winning combo glow
      tl.to("#reel1 .symbol:nth-child(3)", { scale: 1.3, duration: 0.4, ease: "back.out(2)" }, 2.5);
      tl.to("#reel2 .symbol:nth-child(3)", { scale: 1.3, duration: 0.4, ease: "back.out(2)" }, 2.7);
      tl.to("#reel3 .symbol:nth-child(3)", { scale: 1.3, duration: 0.4, ease: "back.out(2)" }, 2.9);

      // 5s: Multiplier appears
      tl.to("#multiplier", { scale: 1, duration: 0.3, ease: "back.out(3)" }, 5);
      tl.to("#multiplier", { scale: 1.1, duration: 0.2, yoyo: true, repeat: 3 }, 5.4);

      // 6s: Win popup
      tl.to("#win-popup", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 6);

      // 6s: Coins fly
      tl.to("#coin1", { opacity: 1, y: -200, rotation: 360, duration: 1.5, ease: "power2.out" }, 6);
      tl.to("#coin2", { opacity: 1, y: -250, rotation: -360, duration: 1.8, ease: "power2.out" }, 6.3);
      tl.to("#coin3", { opacity: 1, y: -180, rotation: 360, duration: 1.2, ease: "power2.out" }, 6.6);

      // 7s: Balance counter update
      tl.to("#balance", { textContent: 4750, duration: 1, snap: { textContent: 50 }, ease: "power1.out", onUpdate: function() {
        const val = Math.round(this.targets()[0].textContent);
        document.getElementById("balance").textContent = "A$ " + val.toLocaleString() + ".00";
      }}, 7);

      // 9s: Win popup fades
      tl.to("#win-popup", { opacity: 0.7, scale: 0.95, duration: 0.3 }, 9);
      tl.to("#multiplier", { opacity: 0, duration: 0.3 }, 9);

      // 11s: CTA appears
      tl.to("#cta", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 11);
      tl.from("#cta-text", { y: 20, duration: 0.3 }, 11.1);
      tl.from("#cta-sub", { y: 20, opacity: 0, duration: 0.3 }, 11.3);

      // 13s: CTA pulse
      tl.to("#cta", { scale: 1.05, duration: 0.3, yoyo: true, repeat: 3 }, 13);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
